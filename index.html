<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sylvan Defenders 2.5D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #1a1a2e; overflow: hidden; font-family: 'Cinzel', serif; }
  /* The single responsive canvas fills the window; Phaser FIT-scales the game inside it. */
  #game-container { width: 100%; height: 100%; }
  #game-container canvas { display: block; }
</style>
</head>
<body>
<div id="game-container"></div>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
